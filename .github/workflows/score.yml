# Checks the rain every 3 hours from GitHub's computers and sends the risk map to the live server, in case the
# forecast API refuses the server's shared internet address. Needs two repository SECRETS (Settings -> Secrets and
# variables -> Actions -> Secrets): SERVER_URL (https://...onrender.com) and SNAPSHOT_TOKEN (same as on Render).
name: check the rain
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - run: pip install -r requirements-server.txt
      - name: score Karnataka and send the map to the server
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
          SCHEDULER_ENABLED: "false"
        run: python -m backend.app.jobs.push_snapshot
