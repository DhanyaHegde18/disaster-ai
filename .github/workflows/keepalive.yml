# Render's free servers sleep after 15 minutes without visitors, and a sleeping server doesn't check the rain.
# UptimeRobot (docs/DEPLOY.md) visits every 5 minutes; this job is a second, slower backup.
# Set the repository variable SERVER_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://disaster-ai.onrender.com
name: keep the server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.SERVER_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: visit /health (a sleeping server takes about a minute to wake up)
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 120 "${{ vars.SERVER_URL }}/health" > /dev/null && exit 0
            sleep 30
          done
          exit 1
