<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4f6e">
  <title>ಊರಿನ ಎಚ್ಚರಿಕೆ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="villager.css">
</head>
<body>
  <header class="bar">
    <div>
      <h1 data-t="app"></h1>
      <p data-t="tagline"></p>
    </div>
    <button class="lang" id="btn-lang" type="button" aria-label="Change language">English</button>
  </header>

  <div class="demo" id="demo-banner" hidden data-t="demo"></div>
  <div class="net" id="net-banner" role="status" hidden data-t="offlineBanner"></div>

  <main>
    <section id="picker" hidden>
      <h2 data-t="choose"></h2>
      <label class="pick-label" for="v-search" data-t="searchLabel"></label>
      <input class="pick-input" id="v-search" type="search" autocomplete="off" placeholder="Ujire, Dharmasthala…">
      <div class="village-buttons" id="search-results"></div>
      <p class="hint pick-or" data-t="orBrowse"></p>
      <div class="pick-row">
        <label for="pick-district" class="sr-only" data-t="district"></label>
        <select id="pick-district" class="pick-input"></select>
        <label for="pick-taluk" class="sr-only" data-t="taluk"></label>
        <select id="pick-taluk" class="pick-input" disabled></select>
      </div>
      <input class="pick-input" id="v-filter" type="search" autocomplete="off" hidden>
      <div class="village-buttons" id="village-buttons"></div>
    </section>

    <section id="home" hidden>
      <div class="place">
        <span><span id="place-name"></span> <span class="place-sub" id="place-sub"></span></span>
        <button class="link" id="btn-change" type="button" data-t="change"></button>
      </div>

      <button class="big hear" id="btn-hear" type="button" hidden></button>
      <div id="status"></div>

      <div class="outbox" id="outbox" role="status" hidden>
        <p id="outbox-text"></p>
        <p class="urgent" id="outbox-rescue" hidden data-t="outboxRescue"></p>
      </div>

      <div class="actions">
        <button class="big secondary" id="btn-sound" type="button" aria-pressed="false" data-t="soundOff"></button>
        <a class="big call" id="call" href="tel:112"><span data-t="call"></span></a>
        <button class="big secondary sms" id="btn-sms" type="button" data-t="smsSos"></button>
        <button class="big secondary" id="btn-install" type="button" hidden data-t="install"></button>
      </div>
      <p class="hint push-note" id="push-note" role="status" hidden></p>
      <p class="hint ntfy-note" id="ntfy-note" hidden></p>
      <p class="hint sms-hint" data-t="smsHint"></p>

      <section class="centres" id="centres" aria-labelledby="centres-title">
        <div class="centres-top">
          <h2 id="centres-title" data-t="shelterTitle"></h2>
          <button class="link" id="btn-locate" type="button" data-t="useLocation"></button>
        </div>
        <p class="hint" id="centres-from"></p>
        <p class="none-open" id="none-open" hidden data-t="noneOpen"></p>
        <div id="centre-list"></div>
        <div class="route-box" id="route-box" hidden>
          <p class="route-title" id="route-title"></p>
          <div id="route-map" role="region" aria-label="Map: route to the relief centre"></div>
          <p class="route-info" id="route-info" aria-live="polite"></p>
          <p class="hint urgent" data-t="routeSafety"></p>
        </div>
      </section>

      <section class="report" id="report" aria-labelledby="report-title">
        <h2 id="report-title" data-t="reportTitle"></h2>
        <p class="why" data-t="reportWhy"></p>

        <form id="r-phone-form" novalidate>
          <label for="r-phone" data-t="reportSignIn"></label>
          <div class="phone-row"><span>+91</span>
            <input id="r-phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98765 43210">
          </div>
          <button class="big primary" type="submit" data-t="sendCode"></button>
        </form>

        <form id="r-code-form" novalidate hidden>
          <p class="hint" id="r-sent"></p>
          <p class="democode" id="r-demo" hidden></p>
          <label for="r-code" data-t="codeLabel"></label>
          <input id="r-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
          <button class="big primary" type="submit" data-t="signIn"></button>
        </form>

        <form id="r-form" novalidate hidden>
          <p class="hint" data-t="howMany"></p>
          <div class="steppers" id="steppers"></div>
          <fieldset class="needs">
            <legend data-t="needsTitle"></legend>
            <div id="needs"></div>
            <p class="hint urgent" data-t="rescueNote"></p>
          </fieldset>
          <button class="big primary" type="submit" data-t="sendStatus"></button>
          <p class="hint" id="r-last"></p>
          <button class="link" type="button" id="r-logout" data-t="logout"></button>
        </form>
        <p class="r-error" id="r-error" role="alert" hidden></p>
      </section>

      <section class="recent" id="recent-wrap" hidden>
        <h2 data-t="recent"></h2>
        <div id="recent"></div>
      </section>

      <section class="tips">
        <h2 data-t="tipsTitle"></h2>
        <ul id="tips"></ul>
      </section>

      <p class="foot"><span data-t="onlyApproved"></span><br><span id="checked"></span></p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="villager.js"></script>
</body>
</html>
